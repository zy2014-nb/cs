<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CS2D - 2D反恐精英</title>
  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <!-- Menu Screen -->
  <div id="menu" class="screen">
    <div class="menu-box">
      <h1 class="game-title">CS<span>2D</span></h1>
      <p class="subtitle">2D 反恐精英 · 多人对战</p>

      <div class="form-group">
        <label>昵称</label>
        <input type="text" id="nickname" placeholder="输入你的昵称" maxlength="12" value="">
      </div>

      <div class="btn-row">
        <button id="btnCreate" class="btn btn-primary">创建房间</button>
      </div>

      <div class="divider"><span>或者</span></div>

      <div class="form-group">
        <label>房间码</label>
        <input type="text" id="roomCode" placeholder="输入6位房间码" maxlength="6">
      </div>
      <button id="btnJoin" class="btn btn-secondary">加入房间</button>

      <div id="menuError" class="error-msg"></div>

      <div class="instructions">
        <h3>操作说明</h3>
        <div class="keys">
          <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动</span>
          <span><kbd>鼠标</kbd> 瞄准</span>
          <span><kbd>左键</kbd> 射击</span>
          <span><kbd>R</kbd> 换弹</span>
          <span><kbd>1</kbd> 手枪</span>
          <span><kbd>2</kbd> 步枪</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Game Screen -->
  <div id="gameScreen" class="screen hidden">
    <canvas id="gameCanvas"></canvas>

    <!-- HUD -->
    <div id="hud">
      <div class="hud-top">
        <div class="room-info">房间: <span id="displayRoomCode"></span></div>
        <div id="killFeed" class="kill-feed"></div>
      </div>

      <div class="hud-bottom-left">
        <div class="hp-bar-container">
          <div id="hpBar" class="hp-bar"></div>
          <span id="hpText" class="hp-text">100</span>
        </div>
      </div>

      <div class="hud-bottom-right">
        <div class="weapon-info">
          <span id="weaponName">USP-S</span>
          <span id="ammoDisplay" class="ammo">12 / 36</span>
        </div>
      </div>

      <div class="hud-top-right">
        <div class="scoreboard" id="scoreboard">
          <div class="scoreboard-header">玩家列表</div>
          <div id="playerList"></div>
        </div>
      </div>
    </div>

    <!-- Respawn overlay -->
    <div id="respawnOverlay" class="overlay hidden">
      <div class="overlay-content">
        <h2>你被击杀了</h2>
        <p id="killMessage"></p>
        <p id="respawnCountdown">3</p>
      </div>
    </div>

    <!-- Reload overlay -->
    <div id="reloadOverlay" class="reload-indicator hidden">换弹中...</div>

    <button id="btnLeave" class="btn-leave">退出房间</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
